name: Build VMouse Driver

on:
  push:
    paths:
      - 'core/vmouse_drv/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install WDK
      shell: pwsh
      timeout-minutes: 35
      run: |
        $installer = "$env:TEMP\wdksetup.exe"

        Write-Host "WDK 다운로드 중..."
        curl.exe -L -f -o $installer `
          "https://download.microsoft.com/download/eb29e759-d7ad-4541-b60c-e9774ad8c593/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
        if ($LASTEXITCODE -ne 0) { throw "다운로드 실패" }

        $bytes = [System.IO.File]::ReadAllBytes($installer)
        if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "PE 헤더 없음 (HTML 반환)" }
        Write-Host "EXE 확인: $([math]::Round((Get-Item $installer).Length/1MB,1)) MB"

        Write-Host "WDK 설치 중..."
        $proc = Start-Process -FilePath $installer `
          -ArgumentList "/features + /quiet /norestart" `
          -Wait -PassThru
        Write-Host "설치 종료 코드: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          throw "WDK 설치 실패 (exit $($proc.ExitCode))"
        }

        # 부트스트래퍼가 백그라운드 설치를 시작했을 수 있으므로 대기
        Write-Host "설치 완료 대기 중 (최대 15분)..."
        $deadline = [DateTime]::Now.AddMinutes(15)
        $props = $null
        while ([DateTime]::Now -lt $deadline) {
          # 모든 가능한 경로 탐색
          $props = Get-ChildItem -Path "C:\", "D:\" `
                     -Filter "WindowsDriver.Default.props" `
                     -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if ($props) {
            Write-Host "발견: $($props.FullName)"
            break
          }

          # 현재 상태 출력
          $wkDirs = @(
            "C:\Program Files (x86)\Windows Kits",
            "C:\Program Files\Windows Kits",
            "D:\Program Files (x86)\Windows Kits"
          ) | Where-Object { Test-Path $_ }
          Write-Host "$(Get-Date -Format 'HH:mm:ss') 대기 중... Windows Kits 경로: $($wkDirs -join '; ')"
          Start-Sleep -Seconds 20
        }

        if (-not $props) {
          # 진단 정보 출력
          Write-Host "=== 진단: 드라이브 목록 ==="
          Get-PSDrive -PSProvider FileSystem | Select-Object Root, Used, Free | Format-Table

          Write-Host "=== 진단: Windows Kits 폴더 ==="
          foreach ($base in @("C:\Program Files (x86)", "C:\Program Files", "D:\Program Files (x86)", "D:\Program Files")) {
            $kits = "$base\Windows Kits"
            if (Test-Path $kits) {
              Write-Host "[$kits]"
              Get-ChildItem $kits -Depth 3 -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "없음: $kits"
            }
          }

          Write-Host "=== 진단: 레지스트리 ==="
          Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
            -ErrorAction SilentlyContinue | Format-List

          Write-Host "=== 진단: VS Extensions 내 WDK ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            -Filter "*WindowsDriver*" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName)" }

          throw "WDK 설치 타임아웃: WindowsDriver.Default.props 없음"
        }

        # WDKContentRoot = props 파일의 상위 2단계 (build 폴더의 부모)
        $wdkRoot = $props.Directory.Parent.FullName.TrimEnd('\') + '\'
        Write-Host "WDKContentRoot = $wdkRoot"
        Add-Content -Path $env:GITHUB_ENV -Value "WDKContentRoot=$wdkRoot"

        Get-ChildItem "$wdkRoot\Include" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  Include: $($_.Name)" }

    - name: Build vmouse.sys
      shell: pwsh
      run: |
        Write-Host "WDKContentRoot = $env:WDKContentRoot"
        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild "core\vmouse_drv\vmouse.vcxproj" `
          /p:Configuration=Release /p:Platform=x64 /v:normal
        if ($LASTEXITCODE -ne 0) { throw "빌드 실패" }
        Get-Item "core\vmouse_drv\x64\Release\vmouse.sys" |
          Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}}

    - name: Upload vmouse.sys
      uses: actions/upload-artifact@v4
      with:
        name: vmouse-driver
        path: |
          core/vmouse_drv/x64/Release/vmouse.sys
          core/vmouse_drv/vmouse.inf
        retention-days: 90
