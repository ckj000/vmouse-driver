name: Build VMouse Driver

on:
  push:
    paths:
      - 'core/vmouse_drv/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install WDK
      shell: pwsh
      timeout-minutes: 35
      run: |
        $installer = "$env:TEMP\wdksetup.exe"

        Write-Host "WDK 다운로드 중..."
        curl.exe -L -f -o $installer `
          "https://download.microsoft.com/download/eb29e759-d7ad-4541-b60c-e9774ad8c593/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
        if ($LASTEXITCODE -ne 0) { throw "다운로드 실패" }

        $bytes = [System.IO.File]::ReadAllBytes($installer)
        if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "PE 헤더 없음" }
        Write-Host "EXE 확인: $([math]::Round((Get-Item $installer).Length/1MB,1)) MB"

        Write-Host "WDK 설치 중..."
        $proc = Start-Process -FilePath $installer `
          -ArgumentList "/features + /quiet /norestart" `
          -Wait -PassThru
        Write-Host "설치 종료 코드: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          throw "WDK 설치 실패 (exit $($proc.ExitCode))"
        }

        # WDKContentRoot 탐색 (구버전/신버전 WDK 모두 지원)
        # 구버전: props = KitsRoot\build\WindowsDriver.Default.props → WDKContentRoot = KitsRoot\
        # 신버전: props = KitsRoot\build\VERSION\WindowsDriver.Default.props → WDKContentRoot = KitsRoot\build\VERSION\
        Write-Host "WDK 경로 탐색 중 (최대 15분)..."
        $wdkRoot = $null
        $deadline = [DateTime]::Now.AddMinutes(15)

        while ([DateTime]::Now -lt $deadline) {
          $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                         -ErrorAction SilentlyContinue).KitsRoot10
          Write-Host "레지스트리 KitsRoot10: '$kitsRoot'"

          if ($kitsRoot) {
            $buildDir = "$($kitsRoot.TrimEnd('\'))\build"

            # 구버전: $buildDir\WindowsDriver.Default.props 직접 존재
            if (Test-Path "$buildDir\WindowsDriver.Default.props") {
              $wdkRoot = "$($kitsRoot.TrimEnd('\'))\"
              Write-Host "구버전 WDK 구조 발견: $wdkRoot"
              break
            }

            # 신버전: $buildDir\<버전>\WindowsDriver.Default.props (버전별 하위폴더)
            if (Test-Path $buildDir) {
              $versionDir = Get-ChildItem $buildDir -Directory -ErrorAction SilentlyContinue |
                              Where-Object { Test-Path "$($_.FullName)\WindowsDriver.Default.props" } |
                              Sort-Object Name -Descending |
                              Select-Object -First 1
              if ($versionDir) {
                $wdkRoot = "$($versionDir.FullName.TrimEnd('\'))\"
                Write-Host "신버전 WDK 구조 발견: $wdkRoot"
                Write-Host "  버전 폴더: $($versionDir.Name)"
                break
              }

              # build\ 폴더 내용 출력 (진단)
              $subdirs = Get-ChildItem $buildDir -ErrorAction SilentlyContinue
              Write-Host "  $buildDir 내용: $($subdirs.Name -join ', ')"
            } else {
              Write-Host "  $buildDir 없음 (아직 설치 중)"
            }
          }

          Write-Host "$(Get-Date -Format 'HH:mm:ss') 설치 대기 중..."
          Start-Sleep -Seconds 15
        }

        if (-not $wdkRoot) {
          Write-Host "=== 최종 진단 ==="
          $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                         -ErrorAction SilentlyContinue).KitsRoot10
          if ($kitsRoot) {
            Get-ChildItem "$kitsRoot\build" -Depth 2 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          }
          throw "WDK 경로 탐색 실패"
        }

        Add-Content -Path $env:GITHUB_ENV -Value "WDKContentRoot=$wdkRoot"
        Write-Host "WDKContentRoot 설정 완료: $wdkRoot"

        # KitsRoot10 추출 (wdkRoot 상위 2단계)
        $kitsBase = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots").KitsRoot10
        if (-not $kitsBase) {
          $kitsBase = [System.IO.Directory]::GetParent([System.IO.Directory]::GetParent($wdkRoot.TrimEnd('\')).FullName).FullName + "\"
        }
        Write-Host "KitsRoot10 = $kitsBase"
        Add-Content -Path $env:GITHUB_ENV -Value "KitsRoot10=$kitsBase"

        # KMDF 버전 탐지
        $kmdfDir = Get-ChildItem "$kitsBase`Include\wdf\kmdf" -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Descending | Select-Object -First 1
        if ($kmdfDir) {
          Write-Host "KmdfVersion = $($kmdfDir.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "KmdfVersion=$($kmdfDir.Name)"
        }

        # WDK 파일 구조 진단 출력
        Write-Host "=== WDK 파일 구조 ==="
        Write-Host "[build\]"
        Get-ChildItem "$kitsBase`build" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name) [$(if($_.PSIsContainer){'DIR'}else{[math]::Round($_.Length/1KB,1)+'KB'})]" }
        $vd = Get-ChildItem "$kitsBase`build" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($vd) {
          Write-Host "[$($vd.Name)\]"
          Get-ChildItem $vd.FullName -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name) [$(if($_.PSIsContainer){'DIR'}else{[math]::Round($_.Length/1KB,1)+'KB'})]" }
        }
        Write-Host "[Include\wdf\kmdf\]"
        Get-ChildItem "$kitsBase`Include\wdf\kmdf" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name)" }
        Write-Host "[Lib\wdf\kmdf\x64\]"
        Get-ChildItem "$kitsBase`Lib\wdf\kmdf\x64" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Diagnose WDK Layout
      shell: pwsh
      run: |
        $kitsRoot = $env:KitsRoot10
        $ver = Split-Path $env:WDKContentRoot -Leaf

        $out = @()
        $out += "KitsRoot10 = $kitsRoot"
        $out += "KmdfVersion = $env:KmdfVersion"
        $out += "WdkVersion = $ver"
        $out += ""

        $out += "=== Include\wdf\kmdf\ ==="
        Get-ChildItem "$kitsRoot`Include\wdf\kmdf" -ErrorAction SilentlyContinue |
          ForEach-Object { $out += "  $($_.Name)" }

        $out += "=== Lib\$ver\km\x64\ (관련 *.lib) ==="
        Get-ChildItem "$kitsRoot`Lib\$ver\km\x64" -Filter "*.lib" -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match "vhf|wdf|nt|hal|buffer|overflow|gs" } |
          ForEach-Object { $out += "  $($_.Name)  $([math]::Round($_.Length/1KB,1))KB" }

        $out += "=== Lib\wdf\kmdf\x64\ (전체 *.lib) ==="
        Get-ChildItem "$kitsRoot`Lib\wdf\kmdf\x64" -ErrorAction SilentlyContinue |
          ForEach-Object {
            $out += "  [$($_.Name)]"
            Get-ChildItem $_.FullName -Filter "*.lib" -ErrorAction SilentlyContinue |
              ForEach-Object { $out += "    $($_.Name)  $([math]::Round($_.Length/1KB,1))KB" }
          }

        $out += ""
        $out += "vhfkm.lib: $(Test-Path "$kitsRoot`Lib\$ver\km\x64\vhfkm.lib")"
        $out += "ntoskrnl.lib: $(Test-Path "$kitsRoot`Lib\$ver\km\x64\ntoskrnl.lib")"
        $out += "bufferoverflowk.lib: $(Test-Path "$kitsRoot`Lib\$ver\km\x64\bufferoverflowk.lib")"
        $out += "vhf.h: $(Test-Path "$kitsRoot`Include\$ver\km\vhf.h")"

        $out | ForEach-Object { Write-Host $_ }
        $out | Set-Content -Path "diagnose_output.txt" -Encoding UTF8

        # KMDF lib 목록을 annotation으로 출력 (GitHub API에서 인증 없이 확인)
        Write-Host "::warning::=== KMDF LIB FILES ==="
        Get-ChildItem "$kitsRoot`Lib\wdf\kmdf\x64" -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "::warning::KMDF_LIB: $($_.FullName)" }
        # WDF build 폴더의 *.lib도 확인
        Write-Host "::warning::=== WDK BUILD LIB FILES ==="
        Get-ChildItem "$kitsRoot`build" -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue |
          Select-Object -First 30 |
          ForEach-Object { Write-Host "::warning::BUILD_LIB: $($_.FullName)" }

    - name: Build vmouse.sys
      shell: pwsh
      run: |
        Write-Host "WDKContentRoot = $env:WDKContentRoot"
        Write-Host "KitsRoot10     = $env:KitsRoot10"
        Write-Host "KmdfVersion    = $env:KmdfVersion"

        # props 파일 존재 확인 (신버전/구버전 모두)
        $propsNew = "$env:WDKContentRoot`WindowsDriver.Default.props"
        $propsOld = "$env:WDKContentRoot`build\WindowsDriver.Default.props"
        if ((Test-Path $propsNew) -or (Test-Path $propsOld)) {
          Write-Host "props 파일 확인됨"
        } else {
          throw "props 파일 없음: $propsNew / $propsOld"
        }

        # vhfkm.lib 없으면 경고 (나중에 확인용)
        $kitsRoot = $env:KitsRoot10
        $ver = Split-Path $env:WDKContentRoot -Leaf
        if (-not (Test-Path "$kitsRoot`Lib\$ver\km\x64\vhfkm.lib")) {
          Write-Host "[경고] vhfkm.lib 없음 - VHF 미설치 or 경로 다름"
          Write-Host "  대안: $(Get-ChildItem "$kitsRoot`Lib\$ver\km\x64" -Filter "*vhf*" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)"
        }

        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        # 빌드 출력 파일에 저장 (항상 아티팩트로 업로드됨)
        & $msbuild "core\vmouse_drv\vmouse.vcxproj" `
          /p:Configuration=Release /p:Platform=x64 /v:detailed `
          2>&1 | Tee-Object -FilePath "build_output.txt"
        $exitCode = $LASTEXITCODE

        # 빌드 실패 시에만 에러 분석
        if ($exitCode -ne 0) {
          $errors = Get-Content "build_output.txt" |
            Where-Object { $_ -match "error (C|LNK|MSB)\d|cannot open|unresolved" } |
            Select-Object -First 20
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Write-Host "::error::--- 에러 패턴 미매칭, 마지막 20줄 ---"
            Get-Content "build_output.txt" -Tail 20 |
              ForEach-Object { Write-Host "::warning::$_" }
          }
          throw "빌드 실패 (exit $exitCode)"
        }

        # 출력 파일 찾기 (경로 진단)
        Write-Host "=== 빌드 출력 파일 탐색 ==="
        $found = Get-ChildItem "core\vmouse_drv" -Recurse -Include "vmouse.sys","vmouse.exe" -ErrorAction SilentlyContinue
        $found | ForEach-Object { Write-Host "  발견: $($_.FullName)  $([math]::Round($_.Length/1KB,1))KB" }
        if (-not $found) {
          Write-Host "::warning::vmouse.sys/exe 없음, 출력 디렉토리 목록:"
          Get-ChildItem "core\vmouse_drv\x64" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
        }

        $sysPath = "core\vmouse_drv\x64\Release\vmouse.sys"
        # .exe → .sys 이름 변경
        if (-not (Test-Path $sysPath)) {
          $anyExe = $found | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          if ($anyExe) {
            Write-Host "$($anyExe.FullName) -> $sysPath 이름 변경"
            Copy-Item $anyExe.FullName $sysPath -Force
          }
        }
        Get-Item $sysPath | Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}}

        # === 테스트 인증서 서명 ===
        Write-Host ""
        Write-Host "=== 테스트 인증서로 드라이버 서명 ==="
        $infDir = "core\vmouse_drv"

        # 1. Self-signed code-signing cert 생성
        $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=VMouse Test Driver" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256
        Write-Host "인증서 지문: $($cert.Thumbprint)"

        # 2. .sys를 INF 폴더로 복사 (inf2cat이 INF와 같은 폴더에서 파일 탐색)
        Copy-Item $sysPath "$infDir\vmouse.sys" -Force
        Write-Host "vmouse.sys 복사 완료"

        # 3. signtool 찾기
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse `
            -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Select-Object -First 1 -ExpandProperty FullName
        if (-not $signtool) {
            $signtool = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Recurse `
                -Filter "signtool.exe" -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "signtool: $signtool"

        # 4. vmouse.sys 서명 (inf2cat이 서명된 파일을 해시하도록 서명을 먼저)
        & $signtool sign /v /s My /sha1 $cert.Thumbprint /fd sha256 "$infDir\vmouse.sys"
        if ($LASTEXITCODE -ne 0) { throw "vmouse.sys 서명 실패" }
        Write-Host "vmouse.sys 서명 완료"

        # 5. inf2cat으로 카탈로그(.cat) 생성
        $inf2cat = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse `
            -Filter "Inf2Cat.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
        Write-Host "inf2cat: $inf2cat"
        if (-not $inf2cat) { throw "inf2cat 없음 - WDK가 정상 설치됐는지 확인 필요" }

        & $inf2cat /driver:"$infDir" /os:10_x64 2>&1 | Write-Host

        # 6. vmouse.cat 서명
        $catFile = "$infDir\vmouse.cat"
        if (Test-Path $catFile) {
            & $signtool sign /v /s My /sha1 $cert.Thumbprint /fd sha256 $catFile
            if ($LASTEXITCODE -ne 0) { throw "vmouse.cat 서명 실패" }
            Write-Host "vmouse.cat 서명 완료"
        } else {
            Write-Host "::error::vmouse.cat 생성 실패"
            Get-ChildItem $infDir | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "inf2cat이 .cat 파일을 생성하지 않음"
        }

        # 7. 인증서 공개키 내보내기 (사용자가 PC에 설치할 .cer)
        Export-Certificate -Cert $cert -FilePath "$infDir\VMouseTestCert.cer" | Out-Null
        Write-Host "VMouseTestCert.cer 내보내기 완료"

        # 8. devcon.exe 복사 (Root\VMouse 장치 노드 생성용)
        $devcon = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Tools" -Recurse `
            -Filter "devcon.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
        if ($devcon) {
            Copy-Item $devcon "$infDir\devcon.exe" -Force
            Write-Host "devcon.exe 복사: $devcon"
        } else {
            Write-Host "::warning::devcon.exe 없음 - WDK Tools 경로 확인 필요"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Tools" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
        }

        Write-Host ""
        Write-Host "=== 서명된 파일 목록 ==="
        Get-ChildItem $infDir -File | Where-Object { $_.Extension -in ".sys",".cat",".cer",".inf",".exe" } |
            ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1KB,1))KB" }

    - name: Upload build log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          build_output.txt
          diagnose_output.txt
        retention-days: 7

    - name: Upload vmouse.sys
      uses: actions/upload-artifact@v4
      with:
        name: vmouse-driver
        path: |
          core/vmouse_drv/vmouse.sys
          core/vmouse_drv/vmouse.inf
          core/vmouse_drv/vmouse.cat
          core/vmouse_drv/VMouseTestCert.cer
          core/vmouse_drv/devcon.exe
        retention-days: 90
