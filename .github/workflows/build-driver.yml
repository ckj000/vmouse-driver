name: Build VMouse Driver

on:
  push:
    paths:
      - 'core/vmouse_drv/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install WDK and set WDKContentRoot
      shell: pwsh
      run: |
        # WDK 이미 설치됐는지 확인
        $props = Get-ChildItem "C:\Program Files*\Windows Kits\*\build\WindowsDriver.Default.props" `
                   -ErrorAction SilentlyContinue | Select-Object -First 1

        if (-not $props) {
          Write-Host "WDK 미설치 → Chocolatey로 설치 시도..."
          choco install windows-driver-kit -y --timeout 3600
          $props = Get-ChildItem "C:\Program Files*\Windows Kits\*\build\WindowsDriver.Default.props" `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
        }

        if (-not $props) {
          Write-Host "Chocolatey 실패 → 레지스트리에서 경로 탐색..."
          $reg = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                   -ErrorAction SilentlyContinue).KitsRoot10
          if ($reg) {
            $props = Get-Item "$reg\build\WindowsDriver.Default.props" -ErrorAction SilentlyContinue
          }
        }

        if (-not $props) {
          throw "WDK를 찾을 수 없습니다. WindowsDriver.Default.props 없음."
        }

        # WDKContentRoot = "build" 폴더의 부모 (trailing backslash 필수)
        $wdkRoot = $props.Directory.Parent.FullName.TrimEnd('\') + '\'
        Write-Host "WDKContentRoot = $wdkRoot"

        # 다음 스텝에서 사용할 수 있도록 GITHUB_ENV에 설정
        Add-Content -Path $env:GITHUB_ENV -Value "WDKContentRoot=$wdkRoot"

        # 설치된 버전 확인
        Get-ChildItem "$wdkRoot\Include" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  WDK Include: $($_.Name)" }

    - name: Build vmouse.sys
      shell: pwsh
      run: |
        Write-Host "WDKContentRoot = $env:WDKContentRoot"
        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild "core\vmouse_drv\vmouse.vcxproj" `
          /p:Configuration=Release /p:Platform=x64 /v:normal
        if ($LASTEXITCODE -ne 0) { throw "빌드 실패" }
        Get-Item "core\vmouse_drv\x64\Release\vmouse.sys" |
          Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}}

    - name: Upload vmouse.sys
      uses: actions/upload-artifact@v4
      with:
        name: vmouse-driver
        path: |
          core/vmouse_drv/x64/Release/vmouse.sys
          core/vmouse_drv/vmouse.inf
        retention-days: 90
