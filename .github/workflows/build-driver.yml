name: Build VMouse Driver

on:
  push:
    paths:
      - 'core/vmouse_drv/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install WDK
      shell: pwsh
      timeout-minutes: 35
      run: |
        $installer = "$env:TEMP\wdksetup.exe"

        Write-Host "WDK 다운로드 중..."
        curl.exe -L -f -o $installer `
          "https://download.microsoft.com/download/eb29e759-d7ad-4541-b60c-e9774ad8c593/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
        if ($LASTEXITCODE -ne 0) { throw "다운로드 실패" }

        $bytes = [System.IO.File]::ReadAllBytes($installer)
        if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "PE 헤더 없음" }
        Write-Host "EXE 확인: $([math]::Round((Get-Item $installer).Length/1MB,1)) MB"

        Write-Host "WDK 설치 중..."
        $proc = Start-Process -FilePath $installer `
          -ArgumentList "/features + /quiet /norestart" `
          -Wait -PassThru
        Write-Host "설치 종료 코드: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          throw "WDK 설치 실패 (exit $($proc.ExitCode))"
        }

        # WDKContentRoot 탐색 (구버전/신버전 WDK 모두 지원)
        # 구버전: props = KitsRoot\build\WindowsDriver.Default.props → WDKContentRoot = KitsRoot\
        # 신버전: props = KitsRoot\build\VERSION\WindowsDriver.Default.props → WDKContentRoot = KitsRoot\build\VERSION\
        Write-Host "WDK 경로 탐색 중 (최대 15분)..."
        $wdkRoot = $null
        $deadline = [DateTime]::Now.AddMinutes(15)

        while ([DateTime]::Now -lt $deadline) {
          $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                         -ErrorAction SilentlyContinue).KitsRoot10
          Write-Host "레지스트리 KitsRoot10: '$kitsRoot'"

          if ($kitsRoot) {
            $buildDir = "$($kitsRoot.TrimEnd('\'))\build"

            # 구버전: $buildDir\WindowsDriver.Default.props 직접 존재
            if (Test-Path "$buildDir\WindowsDriver.Default.props") {
              $wdkRoot = "$($kitsRoot.TrimEnd('\'))\"
              Write-Host "구버전 WDK 구조 발견: $wdkRoot"
              break
            }

            # 신버전: $buildDir\<버전>\WindowsDriver.Default.props (버전별 하위폴더)
            if (Test-Path $buildDir) {
              $versionDir = Get-ChildItem $buildDir -Directory -ErrorAction SilentlyContinue |
                              Where-Object { Test-Path "$($_.FullName)\WindowsDriver.Default.props" } |
                              Sort-Object Name -Descending |
                              Select-Object -First 1
              if ($versionDir) {
                $wdkRoot = "$($versionDir.FullName.TrimEnd('\'))\"
                Write-Host "신버전 WDK 구조 발견: $wdkRoot"
                Write-Host "  버전 폴더: $($versionDir.Name)"
                break
              }

              # build\ 폴더 내용 출력 (진단)
              $subdirs = Get-ChildItem $buildDir -ErrorAction SilentlyContinue
              Write-Host "  $buildDir 내용: $($subdirs.Name -join ', ')"
            } else {
              Write-Host "  $buildDir 없음 (아직 설치 중)"
            }
          }

          Write-Host "$(Get-Date -Format 'HH:mm:ss') 설치 대기 중..."
          Start-Sleep -Seconds 15
        }

        if (-not $wdkRoot) {
          Write-Host "=== 최종 진단 ==="
          $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                         -ErrorAction SilentlyContinue).KitsRoot10
          if ($kitsRoot) {
            Get-ChildItem "$kitsRoot\build" -Depth 2 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          }
          throw "WDK 경로 탐색 실패"
        }

        Add-Content -Path $env:GITHUB_ENV -Value "WDKContentRoot=$wdkRoot"
        Write-Host "WDKContentRoot 설정 완료: $wdkRoot"

        # KitsRoot10 추출 (wdkRoot 상위 2단계)
        $kitsBase = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots").KitsRoot10
        if (-not $kitsBase) {
          $kitsBase = [System.IO.Directory]::GetParent([System.IO.Directory]::GetParent($wdkRoot.TrimEnd('\')).FullName).FullName + "\"
        }
        Write-Host "KitsRoot10 = $kitsBase"
        Add-Content -Path $env:GITHUB_ENV -Value "KitsRoot10=$kitsBase"

        # KMDF 버전 탐지
        $kmdfDir = Get-ChildItem "$kitsBase`Include\wdf\kmdf" -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Descending | Select-Object -First 1
        if ($kmdfDir) {
          Write-Host "KmdfVersion = $($kmdfDir.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "KmdfVersion=$($kmdfDir.Name)"
        }

        # WDK 파일 구조 진단 출력
        Write-Host "=== WDK 파일 구조 ==="
        Write-Host "[build\]"
        Get-ChildItem "$kitsBase`build" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name) [$(if($_.PSIsContainer){'DIR'}else{[math]::Round($_.Length/1KB,1)+'KB'})]" }
        $vd = Get-ChildItem "$kitsBase`build" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($vd) {
          Write-Host "[$($vd.Name)\]"
          Get-ChildItem $vd.FullName -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name) [$(if($_.PSIsContainer){'DIR'}else{[math]::Round($_.Length/1KB,1)+'KB'})]" }
        }
        Write-Host "[Include\wdf\kmdf\]"
        Get-ChildItem "$kitsBase`Include\wdf\kmdf" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name)" }
        Write-Host "[Lib\wdf\kmdf\x64\]"
        Get-ChildItem "$kitsBase`Lib\wdf\kmdf\x64" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Diagnose WDK Layout
      shell: pwsh
      run: |
        $kitsRoot = $env:KitsRoot10
        Write-Host "KitsRoot10 = $kitsRoot"
        Write-Host "KmdfVersion = $env:KmdfVersion"
        Write-Host ""

        Write-Host "=== Include\wdf\kmdf\ ==="
        Get-ChildItem "$kitsRoot`Include\wdf\kmdf" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.Name)" }

        Write-Host "=== Include\$(Split-Path $env:WDKContentRoot -Leaf)\km\ (first 30 files) ==="
        $ver = Split-Path $env:WDKContentRoot -Leaf
        Get-ChildItem "$kitsRoot`Include\$ver\km" -ErrorAction SilentlyContinue |
          Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.Name)" }

        Write-Host "=== Lib\$ver\km\x64\ (*.lib) ==="
        Get-ChildItem "$kitsRoot`Lib\$ver\km\x64" -Filter "*.lib" -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match "vhf|wdf|nt|hal" } |
          ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1KB,1))KB" }

        Write-Host "=== Lib\wdf\kmdf\x64\ ==="
        Get-ChildItem "$kitsRoot`Lib\wdf\kmdf\x64" -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host "  [$($_.Name)]"
            Get-ChildItem $_.FullName -Filter "*.lib" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "    $($_.Name)" }
          }

        Write-Host ""
        Write-Host "vhfkm.lib exists: $(Test-Path "$kitsRoot`Lib\$ver\km\x64\vhfkm.lib")"
        Write-Host "ntoskrnl.lib exists: $(Test-Path "$kitsRoot`Lib\$ver\km\x64\ntoskrnl.lib")"
        Write-Host "vhf.h exists: $(Test-Path "$kitsRoot`Include\$ver\km\vhf.h")"

    - name: Build vmouse.sys
      shell: pwsh
      run: |
        Write-Host "WDKContentRoot = $env:WDKContentRoot"
        Write-Host "KitsRoot10     = $env:KitsRoot10"
        Write-Host "KmdfVersion    = $env:KmdfVersion"

        # props 파일 존재 확인 (신버전/구버전 모두)
        $propsNew = "$env:WDKContentRoot`WindowsDriver.Default.props"
        $propsOld = "$env:WDKContentRoot`build\WindowsDriver.Default.props"
        if ((Test-Path $propsNew) -or (Test-Path $propsOld)) {
          Write-Host "props 파일 확인됨"
        } else {
          throw "props 파일 없음: $propsNew / $propsOld"
        }

        # vhfkm.lib 없으면 경고 (나중에 확인용)
        $kitsRoot = $env:KitsRoot10
        $ver = Split-Path $env:WDKContentRoot -Leaf
        if (-not (Test-Path "$kitsRoot`Lib\$ver\km\x64\vhfkm.lib")) {
          Write-Host "[경고] vhfkm.lib 없음 - VHF 미설치 or 경로 다름"
          Write-Host "  대안: $(Get-ChildItem "$kitsRoot`Lib\$ver\km\x64" -Filter "*vhf*" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)"
        }

        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild "core\vmouse_drv\vmouse.vcxproj" `
          /p:Configuration=Release /p:Platform=x64 /v:detailed 2>&1
        if ($LASTEXITCODE -ne 0) { throw "빌드 실패 (exit $LASTEXITCODE)" }
        Get-Item "core\vmouse_drv\x64\Release\vmouse.sys" |
          Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}}

    - name: Upload vmouse.sys
      uses: actions/upload-artifact@v4
      with:
        name: vmouse-driver
        path: |
          core/vmouse_drv/x64/Release/vmouse.sys
          core/vmouse_drv/vmouse.inf
        retention-days: 90
