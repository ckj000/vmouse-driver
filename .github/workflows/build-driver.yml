name: Build VMouse Driver

on:
  push:
    paths:
      - 'core/vmouse_drv/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install WDK
      shell: pwsh
      timeout-minutes: 35
      run: |
        $installer = "$env:TEMP\wdksetup.exe"

        Write-Host "WDK 다운로드 중..."
        curl.exe -L -f -o $installer `
          "https://download.microsoft.com/download/eb29e759-d7ad-4541-b60c-e9774ad8c593/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
        if ($LASTEXITCODE -ne 0) { throw "다운로드 실패" }

        $bytes = [System.IO.File]::ReadAllBytes($installer)
        if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "PE 헤더 없음" }
        Write-Host "EXE 확인: $([math]::Round((Get-Item $installer).Length/1MB,1)) MB"

        Write-Host "WDK 설치 중..."
        $proc = Start-Process -FilePath $installer `
          -ArgumentList "/features + /quiet /norestart" `
          -Wait -PassThru
        Write-Host "설치 종료 코드: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          throw "WDK 설치 실패 (exit $($proc.ExitCode))"
        }

        # WDKContentRoot 탐색 (직접 경로 체크 - 재귀 탐색 버그 방지)
        # WDKContentRoot 는 "build\" 폴더의 부모여야 함 → 끝에 백슬래시 포함
        Write-Host "WDK 경로 탐색 중 (최대 15분)..."
        $wdkRoot = $null
        $deadline = [DateTime]::Now.AddMinutes(15)

        while ([DateTime]::Now -lt $deadline) {
          # 우선순위 1: 레지스트리 (가장 정확)
          $reg = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                   -ErrorAction SilentlyContinue).KitsRoot10
          Write-Host "레지스트리 KitsRoot10: '$reg'"

          # 우선순위 2: 고정 경로 (WDK 10은 항상 여기에 설치됨)
          $candidates = @()
          if ($reg) { $candidates += $reg.TrimEnd('\') }
          $candidates += "C:\Program Files (x86)\Windows Kits\10"
          $candidates += "C:\Program Files\Windows Kits\10"
          $candidates += "D:\Program Files (x86)\Windows Kits\10"

          foreach ($c in $candidates) {
            $propsPath = "$c\build\WindowsDriver.Default.props"
            if (Test-Path $propsPath) {
              $wdkRoot = "$c\"
              Write-Host "WDK 발견: $wdkRoot"
              Write-Host "props 확인: $propsPath"
              break
            }
          }

          if ($wdkRoot) { break }

          # 아직 없으면 상태 출력 후 대기
          Write-Host "$(Get-Date -Format 'HH:mm:ss') 설치 대기 중..."
          foreach ($c in @("C:\Program Files (x86)\Windows Kits", "C:\Program Files\Windows Kits")) {
            if (Test-Path $c) { Write-Host "  존재: $c → $(Get-ChildItem $c | Select-Object -Expand Name)" }
          }
          Start-Sleep -Seconds 15
        }

        if (-not $wdkRoot) {
          Write-Host "=== 최종 진단 ==="
          # build\WindowsDriver.Default.props 직접 탐색 (진단용만)
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\build" -Depth 1 `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          $reg = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                   -ErrorAction SilentlyContinue
          Write-Host "레지스트리 전체: $($reg | Out-String)"
          throw "WDK 경로 탐색 실패"
        }

        Add-Content -Path $env:GITHUB_ENV -Value "WDKContentRoot=$wdkRoot"

        Get-ChildItem "${wdkRoot}Include" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  Include: $($_.Name)" }

    - name: Build vmouse.sys
      shell: pwsh
      run: |
        Write-Host "WDKContentRoot = $env:WDKContentRoot"
        # props 파일 최종 확인
        $propsFile = "$env:WDKContentRoot`build\WindowsDriver.Default.props"
        if (-not (Test-Path $propsFile)) {
          throw "props 파일 없음: $propsFile"
        }
        Write-Host "props 파일 확인됨: $propsFile"

        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild "core\vmouse_drv\vmouse.vcxproj" `
          /p:Configuration=Release /p:Platform=x64 /v:normal
        if ($LASTEXITCODE -ne 0) { throw "빌드 실패" }
        Get-Item "core\vmouse_drv\x64\Release\vmouse.sys" |
          Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}}

    - name: Upload vmouse.sys
      uses: actions/upload-artifact@v4
      with:
        name: vmouse-driver
        path: |
          core/vmouse_drv/x64/Release/vmouse.sys
          core/vmouse_drv/vmouse.inf
        retention-days: 90
